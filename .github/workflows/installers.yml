# Builds the Windows installer and the Android app.
# Push a tag like v1.0.0 to publish both on the Releases page; or run it by hand from the Actions tab.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run sync
        working-directory: mobile
      - name: Load the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (Settings > Secrets and variables > Actions). See README > Installers."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-test.${GITHUB_RUN_NUMBER}"; fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode="${GITHUB_RUN_NUMBER}" -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/THSC-Cardiac-Rehab-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: THSC-Cardiac-Rehab-*.apk
          if-no-files-found: error

  release:
    # Publishes whatever built, so a missing Android key doesn't hold back the Windows installer.
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.windows.result == 'success' || needs.android.result == 'success')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Windows PC:** download `THSC-Cardiac-Rehab-Setup-….exe` and run it. If Windows shows "Windows protected your PC", click **More info → Run anyway** (the installer is not code-signed).

            **Android tablet or phone:** download `THSC-Cardiac-Rehab-….apk` on the device, open it, and allow "Install unknown apps" for your browser or Files app when asked.

            Patient records in the installed apps are separate from the website version. To move them, use **Export backup** (or **Share backup**) in the old one and **Import backup** in the new one.
